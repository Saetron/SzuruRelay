name: Docker Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run tests
        run: |
          pip install -r requirements.txt
          pytest

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read and Bump Version
        id: versioning
        run: |
          # Read current version from VERSION file (default to 1.0.0 if missing)
          if [ -f VERSION ]; then
            CURRENT_VERSION=$(cat VERSION | tr -d '\n\r ')
          else
            CURRENT_VERSION="1.0.0"
          fi

          echo "Current version: $CURRENT_VERSION"

          # Split version into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Auto-bump patch version (change to MINOR or MAJOR if preferred)
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "New bumped version: $NEW_VERSION"

          # Write new version back to VERSION file
          echo "$NEW_VERSION" > VERSION

          # Save to output for subsequent steps
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Tag Version Bump
        run: |
          VERSION="${{ steps.versioning.outputs.NEW_VERSION }}"
          git add VERSION
          git commit -m "chore(release): bump version to $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Automated release v$VERSION"
          git push origin main --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versioning.outputs.NEW_VERSION }}
            type=semver,pattern={{version}},value=${{ steps.versioning.outputs.NEW_VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
