name: Docker Build & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type ('none' uses VERSION file as-is)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies and run tests
        run: |
          pip install -r requirements.txt
          pytest

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read and Optionally Bump Version
        id: versioning
        run: |
          if [ -f VERSION ]; then
            CURRENT_VERSION=$(tr -d '\n\r ' < VERSION)
          else
            CURRENT_VERSION="2.1.1"
          fi

          echo "Current version: $CURRENT_VERSION"
          BUMP_TYPE="${{ inputs.bump_type || 'none' }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              ;;
            patch)
              PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              ;;
            *)
              NEW_VERSION="$CURRENT_VERSION"
              ;;
          esac

          echo "Target release version: $NEW_VERSION (bump_type=$BUMP_TYPE)"

          if [ "$NEW_VERSION" != "$CURRENT_VERSION" ]; then
            echo "$NEW_VERSION" > VERSION
            echo "BUMPED=true" >> "$GITHUB_OUTPUT"
          else
            echo "BUMPED=false" >> "$GITHUB_OUTPUT"
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and Tag Release Version
        run: |
          VERSION="${{ steps.versioning.outputs.NEW_VERSION }}"
          if [ "${{ steps.versioning.outputs.BUMPED }}" = "true" ]; then
            git add VERSION
            git commit -m "chore(release): bump version to $VERSION [skip ci]"
            git push origin HEAD:main
          fi

          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          else
            echo "Tag v$VERSION already exists, skipping tag creation."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versioning.outputs.NEW_VERSION }}
            type=semver,pattern={{version}},value=${{ steps.versioning.outputs.NEW_VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

